name: Build patched Turso Sync 0.6.1 bindings

on:
  pull_request:
    paths:
      - .github/workflows/build-sync-061-typedarray.yml
      - patches/sync-0.6.1-typedarray.patch
      - scripts/prepare-sync-package.mjs
      - scripts/smoke-sync.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: win32-x64-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            suffix: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out backport
        uses: actions/checkout@v4
        with:
          path: natives
          persist-credentials: false

      - name: Check out pinned Turso 0.6.1 source
        uses: actions/checkout@v4
        with:
          repository: tursodatabase/turso
          ref: 76af5a1250cd98bb26c13862093a638714b0a3a6
          path: turso
          persist-credentials: false

      - name: Apply the three-file N-API backport
        run: |
          git -C turso apply --check ../natives/patches/sync-0.6.1-typedarray.patch
          git -C turso apply ../natives/patches/sync-0.6.1-typedarray.patch
          git -C turso diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install JavaScript build dependencies
        working-directory: turso/bindings/javascript
        run: node .yarn/releases/yarn-4.9.2.cjs install --immutable

      - name: Build native sync binding
        working-directory: turso/bindings/javascript/sync/packages/native
        run: |
          ../../../node_modules/.bin/napi build \
            --target ${{ matrix.target }} \
            --profile release-official \
            --esm \
            --manifest-path ../../Cargo.toml \
            --output-dir .
          test -s sync.${{ matrix.suffix }}.node
          file sync.${{ matrix.suffix }}.node

      - name: Pack and smoke-test native package
        run: |
          package_dir="$RUNNER_TEMP/package-${{ matrix.suffix }}"
          package_file="$RUNNER_TEMP/tursodatabase-sync-${{ matrix.suffix }}-0.6.1.tgz"
          node natives/scripts/prepare-sync-package.mjs \
            '${{ matrix.target }}' \
            "turso/bindings/javascript/sync/packages/native/sync.${{ matrix.suffix }}.node" \
            "$package_dir"
          npm pack "$package_dir" --pack-destination "$RUNNER_TEMP"
          test -s "$package_file"
          mkdir -p "$RUNNER_TEMP/smoke"
          npm install --prefix "$RUNNER_TEMP/smoke" --no-save --ignore-scripts \
            @tursodatabase/sync@0.6.1 "$package_file"
          cp natives/scripts/smoke-sync.mjs "$RUNNER_TEMP/smoke/smoke-sync.mjs"
          node "$RUNNER_TEMP/smoke/smoke-sync.mjs"
          node -e 'const fs=require("node:fs"); const crypto=require("node:crypto"); const path=process.argv[1]; const hash=crypto.createHash("sha256").update(fs.readFileSync(path)).digest("hex"); fs.writeFileSync(path+".sha256", hash+"  "+path.split(/[\\/]/).pop()+"\n")' "$package_file"

      - name: Upload unsigned test artifact
        uses: actions/upload-artifact@v4
        with:
          name: turso-sync-061-typedarray-${{ matrix.suffix }}
          path: |
            ${{ runner.temp }}/tursodatabase-sync-${{ matrix.suffix }}-0.6.1.tgz
            ${{ runner.temp }}/tursodatabase-sync-${{ matrix.suffix }}-0.6.1.tgz.sha256
          if-no-files-found: error
